# On a tag v<version> (equal to package.json's version), test, build, and attach the .vsix to a GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: podarcis.vsix
          generate_release_notes: true
